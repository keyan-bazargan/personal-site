{{/* Analog design refresh — paper grain overlay and ink-dot cursor. */}}

<div class="grain" aria-hidden="true"></div>

<div class="cursor" aria-hidden="true">
  <svg viewBox="-12 -12 24 24">
    <circle class="ring" cx="0" cy="0" r="9"/>
    <circle class="dot" cx="0" cy="0" r="2.2"/>
  </svg>
</div>

<script>
(function () {
  if (matchMedia('(hover: none), (pointer: coarse)').matches) return;

  const cursor = document.querySelector('.cursor');
  if (!cursor) return;

  let tx = window.innerWidth / 2, ty = window.innerHeight / 2;
  let x = tx, y = ty;
  let ready = false;

  window.addEventListener('pointermove', (e) => {
    tx = e.clientX; ty = e.clientY;
    if (!ready) { cursor.classList.add('is-ready'); ready = true; }
  }, { passive: true });

  function tick() {
    x += (tx - x) * 0.5;
    y += (ty - y) * 0.5;
    cursor.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`;
    requestAnimationFrame(tick);
  }
  tick();

  const hoverables = 'a, button, [role="button"], summary, input, textarea, select, label';
  document.addEventListener('pointerover', (e) => {
    if (e.target.closest && e.target.closest(hoverables)) cursor.classList.add('is-hover');
  });
  document.addEventListener('pointerout', (e) => {
    if (e.target.closest && e.target.closest(hoverables)) cursor.classList.remove('is-hover');
  });
})();
</script>

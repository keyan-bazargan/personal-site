name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/design-refresh-animations-cmlrJ
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  SITE_BASE_URL: https://keyanbazargan.com
  PREVIEW_BRANCH: claude/design-refresh-animations-cmlrJ

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
          path: main-src

      - name: Checkout preview branch
        id: preview-checkout
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ env.PREVIEW_BRANCH }}
          submodules: recursive
          fetch-depth: 0
          path: preview-src

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'

      - name: Build main site
        run: hugo --minify --source main-src --destination ../public

      - name: Build preview site
        if: steps.preview-checkout.outcome == 'success'
        run: |
          hugo --minify \
            --source preview-src \
            --destination ../public/preview \
            --baseURL "${SITE_BASE_URL}/preview/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
